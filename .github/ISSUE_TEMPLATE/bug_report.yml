name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug] '
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Do not include secrets or private data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
